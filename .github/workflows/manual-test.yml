name: Manual Testing Builds

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - android
        - windows
        - web
      version:
        description: 'Build version'
        required: false
        default: 'pilot'
        type: string

jobs:
  android-build:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || echo "License acceptance attempted"
        
      - name: Build Android APK (with debug)
        run: |
          echo "=== Building Android APK ==="
          flutter build apk --release --split-per-abi --verbose 2>&1 | tee build.log
          
          if [ $? -ne 0 ]; then
            echo "❌ Build failed!"
            echo "Last 50 lines of build log:"
            tail -50 build.log
            echo "Errors found:"
            grep -i "error\|fail\|exception" build.log | head -20
            exit 1
          fi
          echo "✅ Build successful!"
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.version }}
          path: build/app/outputs/flutter-apk/
          retention-days: 30

  windows-build:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Windows
        run: flutter build windows --release
        
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-${{ github.event.inputs.version }}
          path: build/windows/runner/Release/
          retention-days: 30

  web-build:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Web
        run: flutter build web --release
        
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-${{ github.event.inputs.version }}
          path: build/web/
          retention-days: 30