name: Manual Testing Builds

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - android
        - windows
        - web
      version:
        description: 'Build version'
        required: false
        default: 'pilot'
        type: string

jobs:
  build-selected:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: web
            os: ubuntu-latest
        exclude:
          - platform: ${{ github.event.inputs.platform != 'all' && github.event.inputs.platform != 'android' && 'android' || '' }}
          - platform: ${{ github.event.inputs.platform != 'all' && github.event.inputs.platform != 'windows' && 'windows' || '' }}
          - platform: ${{ github.event.inputs.platform != 'all' && github.event.inputs.platform != 'web' && 'web' || '' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Setup platform-specific tools
        run: |
          if [ "${{ matrix.platform }}" = "android" ]; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
            yes | sdkmanager --licenses
          fi
          
      - name: Build ${{ matrix.platform }}
        run: |
          if [ "${{ matrix.platform }}" = "android" ]; then
            flutter build apk --release --split-per-abi
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            flutter build windows --release
          elif [ "${{ matrix.platform }}" = "web" ]; then
            flutter build web --release
          fi
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build-${{ github.event.inputs.version }}
          path: |
            ${{ matrix.platform == 'android' && 'build/app/outputs/flutter-apk/' || '' }}
            ${{ matrix.platform == 'windows' && 'build/windows/runner/Release/' || '' }}
            ${{ matrix.platform == 'web' && 'build/web/' || '' }}
          retention-days: 30