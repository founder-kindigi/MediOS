name: Manual Testing Builds

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - android
        - windows
        - web
      version:
        description: 'Build version'
        required: false
        default: 'pilot'
        type: string

jobs:
  android-build:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || echo "License acceptance attempted"
        
      - name: Build Android APK (with fallback)
        run: |
          echo "=== Android Build Attempt ==="
          echo "Note: If this fails, web testing is still available"
          flutter clean
          flutter pub get
          
          # Try regular build
          flutter build apk --release --split-per-abi --verbose || {
            echo "❌ Standard build failed, trying debug build..."
            flutter build apk --debug --verbose || {
              echo "❌ All Android builds failed"
              echo "This is expected if Android SDK is not fully configured"
              echo "Web testing can proceed independently"
              exit 1
            }
            echo "⚠️ Debug build succeeded (release failed)"
            exit 1
          }
          echo "✅ Release build successful!"
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.version }}
          path: build/app/outputs/flutter-apk/
          retention-days: 30

  windows-build:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Windows
        run: flutter build windows --release
        
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-${{ github.event.inputs.version }}
          path: build/windows/runner/Release/
          retention-days: 30

  web-build:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Web
        run: flutter build web --release
        
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-${{ github.event.inputs.version }}
          path: build/web/
          retention-days: 30