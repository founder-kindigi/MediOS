name: medios
description: Pharmacy Management System - Android, iOS, Web & Windows
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_common: ^2.5.0
  sqflite_common_ffi: ^2.3.4
  sqflite_common_ffi_web: ^0.4.4
  path_provider: ^2.1.1
  path: ^1.8.3
  intl: ^0.18.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  fl_chart: ^0.65.0
  printing: ^5.11.1
  pdf: ^3.10.4
  share_plus: ^7.2.1
  barcode_widget: ^2.0.4
  responsive_framework: ^1.1.1
  connectivity_plus: ^5.0.2
  file_picker: ^6.1.1
  flutter_local_notifications: ^16.3.2
  local_auth: ^2.1.8
  mobile_scanner: ^3.5.6
  bcrypt: ^1.1.3
  get_it: ^7.6.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/data/
